<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d2a880" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="دعوة عقد قران عمر ومروة — ٢٨ نوفمبر ٢٠٢٦، القاهرة" />
  <meta property="og:title" content="Omer & Marwa | دعوة عقد القران" />
  <meta property="og:description" content="٢٨ نوفمبر ٢٠٢٦ — القاهرة، مصر" />
  <title>Omer & Marwa | دعوة عقد القران</title>

  <link rel="preload" as="image" href="assets/cover.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/hero.webp" type="image/webp" fetchpriority="high" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body class="is-locked">
  <noscript>
    <div class="noscript">هذه الدعوة التفاعلية تحتاج إلى JavaScript لعرض حركة فتح الظرف وخاصية كشف التاريخ.</div>
  </noscript>

  <main id="experience" class="experience" aria-label="دعوة عقد قران عمر ومروة">
    <section id="welcome" class="stage stage--hero" aria-label="مرحباً بكم في حفل عقد القران">
      <div class="stage-art hero-scene">
        <img
          class="invitation-art hero-base"
          src="assets/hero.webp"
          width="941"
          height="1672"
          alt="دعوة عقد قران عمر ومروة بإطار إسلامي ذهبي، وعروسان أمام مسجد وقت الغروب"
          fetchpriority="high"
          decoding="async"
        />

        <img class="hero-motion hero-motion--couple" src="assets/hero.webp" width="941" height="1672" alt="" aria-hidden="true" />
        <img class="hero-motion hero-motion--lantern-left" src="assets/hero.webp" width="941" height="1672" alt="" aria-hidden="true" />
        <img class="hero-motion hero-motion--lantern-right" src="assets/hero.webp" width="941" height="1672" alt="" aria-hidden="true" />
        <span class="lantern-light lantern-light--left" aria-hidden="true"></span>
        <span class="lantern-light lantern-light--right" aria-hidden="true"></span>
      </div>
    </section>

    <section id="families" class="stage" aria-label="تفاصيل عمر ومروة والعائلتين">
      <div class="stage-art">
        <img
          class="invitation-art"
          src="assets/family.webp"
          width="941"
          height="1672"
          alt="تفاصيل عقد قران عمر نجل صلاح عبد الله محمد محمد صالح ومروة ابنة أمين صبري أحمد"
          loading="lazy"
          decoding="async"
        />
      </div>
    </section>

    <section id="date" class="stage" aria-label="التاريخ والمكان">
      <div class="stage-art stage-art--interactive" id="dateArt">
        <img
          class="invitation-art"
          src="assets/date-v2.webp?v=6"
          width="941"
          height="1672"
          alt="تاريخ عقد القران ٢٠٢٦ نوفمبر ٢٨، بعد صلاة المغرب، في قاعة في القاهرة، مصر"
          loading="lazy"
          decoding="async"
        />

        <div class="scratch-group" aria-label="اكشط البطاقات الذهبية لكشف التاريخ">
          <div class="scratch-zone scratch-zone--year" data-scratch="year" aria-label="اكشط لكشف السنة"><canvas></canvas></div>
          <div class="scratch-zone scratch-zone--month" data-scratch="month" aria-label="اكشط لكشف الشهر"><canvas></canvas></div>
          <div class="scratch-zone scratch-zone--day" data-scratch="day" aria-label="اكشط لكشف اليوم"><canvas></canvas></div>
        </div>
      </div>
    </section>

    <section id="timeline" class="stage" aria-label="برنامج الحفل">
      <div class="stage-art">
        <img
          class="invitation-art"
          src="assets/timeline.webp"
          width="941"
          height="1672"
          alt="برنامج الحفل: استقبال الضيوف، عقد القران، العشاء، والاحتفال والتصوير"
          loading="lazy"
          decoding="async"
        />
      </div>
    </section>
  </main>

  <div id="envelope" class="envelope" role="dialog" aria-modal="true" aria-label="افتح دعوة عمر ومروة">
    <div class="envelope-ambient" aria-hidden="true"></div>

    <div class="envelope-card" id="envelopeCard" aria-hidden="true">
      <div class="envelope-preview" aria-hidden="true"></div>
      <div class="envelope-piece envelope-piece--left"></div>
      <div class="envelope-piece envelope-piece--right"></div>
      <div class="envelope-piece envelope-piece--bottom"></div>

      <div class="envelope-flap-liner"></div>
      <div class="envelope-piece envelope-piece--top"></div>

      <div class="opening-light opening-light--halo"></div>
      <div class="opening-light opening-light--vertical"></div>
      <div class="opening-light opening-light--horizontal"></div>
      <div class="opening-light opening-light--spark"></div>
      <div class="opening-trace opening-trace--nw"></div>
      <div class="opening-trace opening-trace--ne"></div>
      <div class="opening-trace opening-trace--sw"></div>
      <div class="opening-trace opening-trace--se"></div>
      <div class="sparkle-wash" aria-hidden="true"></div>
      <div class="seal-glow"></div>
    </div>

    <button id="openInvitation" class="seal-hotspot" type="button" aria-label="اضغط على ختم O and M لفتح الدعوة">
      <span class="sr-only">افتح الدعوة</span>
    </button>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <script src="script.js?v=6"></script>
</body>
</html>
